# yeastar-tg-sms Docker Compose Configuration
#
# This file defines the yeastar-tg-bot service — a Telegram bot that forwards
# SMS messages from a Yeastar PBX to Telegram chats.
#
# Setup:
#   1. Copy .env.example to .env and fill in your values:
#        cp .env.example .env
#   2. Start the bot:
#        docker compose up -d
#   3. View logs:
#        docker logs yeastar-tg-bot
#
# The ./data directory is created automatically by Docker on first run and
# stores the persistent SQLite database (sms.db). This bind mount ensures SMS
# data survives container restarts and rebuilds.

services:
  yeastar-tg-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: yeastar-tg-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/sms.db
