# yeastar-tg-sms Docker Compose Configuration
#
# Setup:
#   1. Copy .env.example to .env and fill in your values:
#        cp .env.example .env
#   2. Build and start the bot:
#        docker compose up -d --build
#   3. View logs:
#        docker logs -f yeastar-tg-bot
#
# The ./data directory is created automatically by Docker on first run and
# stores the persistent SQLite database (sms.db). Data survives container
# restarts and rebuilds.

services:
  yeastar-tg-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: yeastar-tg-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/sms.db
