name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binary
        run: |
          VERSION=${{ github.ref_name }}
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o yeastar-tg-bot ./cmd/yeastar-tg-bot/

      - name: Create release Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM alpine:3.21
          RUN apk --no-cache add ca-certificates tzdata
          RUN adduser -D -h /app appuser
          COPY yeastar-tg-bot /app/yeastar-tg-bot
          RUN chmod +x /app/yeastar-tg-bot && chown -R appuser:appuser /app
          USER appuser
          WORKDIR /app
          CMD ["/app/yeastar-tg-bot"]
          EOF

      - name: Create release docker-compose.yaml
        run: |
          cat > docker-compose.yaml << 'EOF'
          # yeastar-tg-bot
          #
          # Setup:
          #   1. cp .env.example .env
          #   2. Edit .env with your configuration
          #   3. docker compose up -d
          #
          # The ./data directory is created automatically on first run
          # and stores the persistent SQLite database (sms.db).

          services:
            yeastar-tg-bot:
              build: .
              container_name: yeastar-tg-bot
              restart: unless-stopped
              env_file:
                - .env
              volumes:
                - ./data:/app/data
              environment:
                - DB_PATH=/app/data/sms.db
          EOF

      - name: Create release archive
        run: |
          ARCHIVE_NAME="yeastar-tg-bot-${{ github.ref_name }}-linux-amd64"
          mkdir -p "${ARCHIVE_NAME}"
          cp yeastar-tg-bot Dockerfile docker-compose.yaml .env.example README.md "${ARCHIVE_NAME}/"
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: yeastar-tg-bot-${{ github.ref_name }}-linux-amd64.tar.gz
          generate_release_notes: true
